<!DOCTYPE html>
<html lang="en">
<head><title>Xaasio</title></head>
<body>
    <p>
        <b>Bold Text</b><br>
        <strong>Important text</strong><br>
        <p>The last word will be in <i>Italic</i></p><br>
        <em>Emphasized text</em><br>
        <h1>only the text <mark>Marked</mark>will be yellow in color</h1><br>
        <small>This looks smaller compared to rest of the lines</small><br>
        <p>My favourite color is<del>Blue</del></p><br>
        <p>My favorite color is <del>blue</del> <ins>red</ins>!</p>
        <h1>X<sup>2</sup>Y</h1><br>
        <h1>H<sub>2</sub>O</h1><br>
        <p>The word <u>underline</u> will be underlined</p><br>
        
</body>
</html>
