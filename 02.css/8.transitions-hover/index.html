<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Task 8 - Transitions and Hover</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Hover Buttons</h2>
    <button class="btn btn-primary">Lift Up</button>
    <button class="btn btn-danger">Grow</button>
    <button class="btn btn-outline">Fill Color</button>

    <h2>Hover Cards</h2>
    <div class="card-row">
        <div class="card"><h3>Card 1</h3><p>Move your mouse over me.</p></div>
        <div class="card"><h3>Card 2</h3><p>I lift and tilt a little.</p></div>
        <div class="card"><h3>Card 3</h3><p>The shadow grows too.</p></div>
    </div>

    <h2>Transform Demos (hover)</h2>
    <div class="transform-row">
        <div class="shape rotate">rotate</div>
        <div class="shape scale">scale</div>
        <div class="shape skew">skew</div>
        <div class="shape move">translate</div>
    </div>

</body>
</html>
