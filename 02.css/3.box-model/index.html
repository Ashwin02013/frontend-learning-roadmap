<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Task 3 - Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Box Model Practice</h1>

    <div class="card content-box">
        <h3>content-box</h3>
        <p>width 250px + padding 40px + border 10px = 300px on screen.</p>
    </div>

    <div class="card border-box">
        <h3>border-box</h3>
        <p>width 250px includes padding and border = 250px on screen.</p>
    </div>

    <div class="margin-demo">Margin: 10px 10px 10px 100px</div>
</body>
</html>
