<style>
    div{
        background-color: black;
        width: 200px;
        height: 100px;
    }
    .widthmax{
        width:900px;
    }
</style>
<div id="box"></div>
<button onclick="change()">change color</button>
<script>
    var box=document.getElementById("box")
    function change()
    {
        box.setAttribute("class","widthmax")
    }

</script>
